model:
  latent_dim: 256
  vocab_size: 256
  diffusion_steps: 1000
  beta_start: 1e-4
  beta_end: 0.02
  image_channels: 3
  vec_dim: 128
training:
  batch_size: 4
  num_epochs: 2
  learning_rate: 1e-4
  log_interval: 10
  device: "cuda"  # fallback to cpu if unavailable
rl:
  ppo_epochs: 2
  clip_range: 0.2
  gamma: 0.99
  gae_lambda: 0.95
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
